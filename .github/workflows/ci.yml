# =============================================================================
# EKS Observability Stack - CI/CD Pipeline
# =============================================================================

name: CI/CD - EKS Observability Stack

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  packages: write

env:
  TERRAFORM_VERSION: "1.13.0"
  HELM_VERSION: "3.15.0"
  KUSTOMIZE_VERSION: "5.4.0"
  AWS_REGION: "us-east-2"

jobs:
  # ---------------------------------------------------------------------------
  # Terraform Validation
  # ---------------------------------------------------------------------------
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for trufflehog full scan

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive providers/

      - name: Terraform Validate
        run: |
          cd providers && \
          terraform init -backend=false && \
          terraform validate -no-color

  # ---------------------------------------------------------------------------
  # Terraform Security Scan
  # ---------------------------------------------------------------------------
  terraform-security:
    name: Terraform Security Scan (tfsec)
    runs-on: ubuntu-latest
    needs: [terraform-validate]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: true
          working_directory: providers
          exit_code: '0'  # Don't block CI on warnings

  # ---------------------------------------------------------------------------
  # Secret Scanning
  # ---------------------------------------------------------------------------
  secret-scanning:
    name: Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest
    needs: [terraform-validate]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # ---------------------------------------------------------------------------
  # Kustomize Validation
  # ---------------------------------------------------------------------------
  kustomize-validate:
    name: Kustomize Validation
    runs-on: ubuntu-latest
    needs: [terraform-validate]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          mv kustomize /usr/local/bin/

      # Note: overlays use PLACEHOLDER values — build validates structure only
      - name: Build overlay manifests (dry-run)
        run: |
          for env in dev stage prod; do
            echo "Building ${env} overlay..."
            kustomize build k8s-manifests/overlays/${env} --output /dev/null
          done

  # ---------------------------------------------------------------------------
  # Helm Lint
  # ---------------------------------------------------------------------------
  helm-lint:
    name: Helm Chart Lint
    runs-on: ubuntu-latest
    needs: [terraform-validate]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Add Helm repos
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server
          helm repo add fluent https://fluent.github.io/helm-charts
          helm repo add jetstack https://charts.jetstack.io

      - name: Pull Helm charts
        run: |
          helm pull prometheus-community/kube-prometheus-stack --version 88.3.0 --untar --untardir .
          helm pull grafana/grafana                --version 10.5.15 --untar --untardir .
          helm pull grafana/loki                   --version 7.3.0   --untar --untardir .
          helm pull grafana/tempo                  --version 1.24.4  --untar --untardir .

      - name: Lint Prometheus chart
        run: helm lint ./kube-prometheus-stack \
          --values k8s-manifests/prometheus/values.yaml

      - name: Lint Grafana chart
        run: helm lint ./grafana \
          --values k8s-manifests/grafana/values.yaml

      - name: Lint Loki chart
        run: helm lint ./loki \
          --values k8s-manifests/loki/values.yaml

      - name: Lint Tempo chart
        run: helm lint ./tempo \
          --values k8s-manifests/tempo/values.yaml

  # ---------------------------------------------------------------------------
  # Full Pipeline (on main branch push)
  # ---------------------------------------------------------------------------
  full-pipeline:
    name: Full CI Pipeline
    runs-on: ubuntu-latest
    needs: [terraform-validate, terraform-security, secret-scanning, kustomize-validate, helm-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: All checks passed
        run: echo "✓ All CI checks passed successfully"
