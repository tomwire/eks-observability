# =============================================================================
# TruffleHog Secret Scanning Configuration
# =============================================================================
# Note: GitHub Action (trufflesecurity/trufflehog@main) reads this file.
# CLI flag --only-verified and --fail are passed via extra_args in ci.yml.
#
# Known false-positive paths excluded here for TOML-format trufflehog:
exclude_paths:
  - ".git/config"
  - "k8s-manifests/overlays/*"

# Scan all file types
filters:
  - regex: 'PLACEHOLDER_[A-Z_]+'
    description: "Skip Helm values placeholders"
