# =============================================================================
# Alertmanager (subchart of kube-prometheus-stack) - Values
# =============================================================================
alertmanager:
  alertmanagerSpec:
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: gp3
        resources:
          requests:
            storage: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by:
        - alertname
        - cluster
        - service
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'default-receiver'
      routes:
        - match:
            severity: critical
          receiver: 'critical-alerts'
          continue: true
        - match:
            severity: warning
          receiver: 'warning-alerts'
    receivers:
      - name: 'default-receiver'
        webhook_configs:
          - url: 'http://alertmanager-webhook.default.svc.cluster.local:8080/'
      - name: 'critical-alerts'
        webhook_configs:
          - url: 'http://alertmanager-webhook.default.svc.cluster.local:8080/'
      - name: 'warning-alerts'
        webhook_configs:
          - url: 'http://alertmanager-webhook.default.svc.cluster.local:8080/'
