# =============================================================================
# EKS Observability Stack - ArgoCD Application Resources
#
# Each component is deployed as an ArgoCD Application with its own values file.
# ArgoCD handles Helm chart installation, upgrades, and self-healing sync.
#
# All charts are pulled from community helm repos; no local chart management needed.
# =============================================================================

# ---------------------------------------------------------------------------
# Prometheus (Prometheus Operator / kube-prometheus-stack)
# ---------------------------------------------------------------------------

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: eks-observability
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 61.10.0
    chart: kube-prometheus-stack
    helm:
      releaseName: prometheus
      valueFiles:
        - ../../k8s-manifests/prometheus/values.yaml
    postRenderers:
      - kustomize:
          paths:
            - ../../k8s-manifests/alerting-rules.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prometheus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

