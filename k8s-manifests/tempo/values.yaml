# =============================================================================
# Tempo (Grafana Tempo) - Base Values
# =============================================================================
tempo:
  main:
    replicas: 1
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi
    serviceAccount:
      create: true
      name: tempo
    storage:
      type: s3
      s3:
        bucket: PLACEHOLDER_TEMPO_S3_BUCKET
        endpoint: PLACEHOLDER_TEMPO_S3_ENDPOINT
        accessKey: PLACEHOLDER_TEMPO_S3_ACCESS_KEY
        secretKey: PLACEHOLDER_TEMPO_S3_SECRET_KEY
      trace:
        path: /tmp/tempo/trace
    traceGrpc:
      port: 9095
    traceHttp:
      port: 3200
    metricsGenerator:
      enabled: true
      remoteWrite:
        url: http://prometheus-server.prometheus.svc.cluster.local:9090/api/v1/write
    compactor:
      compaction:
        compaction_window: 1h
        block_duration: 2h
        retention_enabled: true
        compaction_options:
          auto_drop: true
    ingester:
      lifecycler:
        ring:
          kvstore:
            store: memberlist
      max_block_duration: 2h
      flush_check_period: 30s
      flush_blocks_on_shutdown: true
    query_frontend:
      search:
        duration_solvable_only: false
      max_outstanding_per_tenant: 2048
    query_scheduler:
      max_outstanding_requests_per_tenant: 2048
    distributor:
      members:
        ring:
          kvstore:
            store: memberlist
      receivers:
        jaeger:
          protocols:
            grpc:
              endpoint: 0.0.0.0:14250
            thrift_http:
              endpoint: 0.0.0.0:14268
            thrift_compact:
              endpoint: 0.0.0.0:6831
            thrift_binary:
              endpoint: 0.0.0.0:6832
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
        zipkin:
          endpoint: 0.0.0.0:9411
    adminAPI:
      enable: true
  admin:
    enabled: true
    service:
      type: ClusterIP
      port: 3200
  metricsGenerator:
    enabled: true
    remoteWrite:
      url: http://prometheus-server.prometheus.svc.cluster.local:9090/api/v1/write
  queryFrontend:
    service:
      type: ClusterIP
      port: 3200
  queryScheduler:
    service:
      type: ClusterIP
      port: 0
  distributor:
    service:
      type: ClusterIP
      port: 0
  ingester:
    service:
      type: ClusterIP
      port: 0
  compactor:
    service:
      type: ClusterIP
      port: 0
